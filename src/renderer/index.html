<!--
--- ARQUITETURA DO SCRIPT ---

Responsabilidades do Script

1. Renderizar a interface raiz da aplicação Electron via React.
2. Carregar estilos e fontes necessários para a UI.
3. Definir favicon e metadados de compatibilidade entre plataformas.

Mapa de Relacionamentos do Script

1. src/main.tsx
   - Tipo: Fluxo de Dados
   - Relação: Ponto de entrada React renderizado dentro de #root.
   - Criticidade: Alta

2. public/favicon.ico
   - Tipo: Relação de UI
   - Relação: Favicon servido via Vite (caminho absoluto /favicon.ico).
   - Criticidade: Baixa

3. public/apple-touch-icon.png
   - Tipo: Relação de UI
   - Relação: Ícone Apple servido via Vite (caminho absoluto /apple-touch-icon.png).
   - Criticidade: Baixa

Invariantes do Script

1. O CSP nunca deve bloquear recursos offline-first do bundle.
2. A tag #root deve sempre estar presente para montagem do React.

--- FIM ARQUITETURA DO SCRIPT ---
-->

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Code Awareness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BUGFIX: Caminhos absolutos via public/ para funcionar no Vite (dev e build) -->
    <!-- Logo gradiente azul-roxo como favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/devicon/devicon.min.css" />
    <!--
      CSP mínima: style_src 'unsafe-inline' necessário para estilos inline do React.
      Fontes vêm do próprio bundle (offline-first), sem dependência externa.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self';" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
