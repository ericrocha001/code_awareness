<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Code Awareness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BUGFIX: Caminhos absolutos via public/ para funcionar no Vite (dev e build) -->
    <!-- Logo gradiente azul-roxo como favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/devicon/devicon.min.css" />
    <!--
      CSP mínima: style_src 'unsafe-inline' necessário para estilos inline do React.
      Fontes vêm do próprio bundle (offline-first), sem dependência externa.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self';" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
