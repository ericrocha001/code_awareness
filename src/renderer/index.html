<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Code Awareness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BUGFIX: Caminhos absolutos via public/ para funcionar no Vite (dev e build) -->
    <!-- Logo gradiente azul-roxo como favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/devicon/devicon.min.css" />
    <!--
      CSP minima: style_src 'unsafe-inline' necessario para estilos inline do React.
      Offline-first: sem fontes externas; usa a pilha de fontes do sistema definida em index.css.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' ws://localhost:5173;" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
