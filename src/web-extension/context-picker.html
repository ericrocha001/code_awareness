<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title data-label="picker"></title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f5f6ff;
      --muted: #bcc8e1;
      --line: #36445e;
      --control: #64728d;
      --field: #202b40;
    }

    * { box-sizing: border-box; }
    body {
      height: 100dvh; display: flex; flex-direction: column; gap: 10px;
      margin: 0; padding: 16px; color: var(--text);
      background: radial-gradient(ellipse at 100% 0%, #383779 0%, transparent 48%),
        radial-gradient(ellipse at 0% 100%, #192945 0%, transparent 48%),
        linear-gradient(150deg, #151e30, #10182a 65%, #19233a);
      font: 13px/1.4 system-ui, sans-serif; overflow-wrap: anywhere; overflow: auto;
    }

    header, .heading, .meta { display: flex; align-items: center; gap: 9px; }
    header { justify-content: space-between; }
    .heading { min-width: 0; }
    h1 { font-size: clamp(16px, 5vw, 19px); line-height: 1.2; margin: 0; letter-spacing: -.025em; }
    p { margin: 0; }
    .metadata { display: grid; gap: 5px; }
    .meta { min-width: 0; }
    #project { font-weight: 600; }
    #destination, small, .field-label { color: var(--muted); }
    header, .metadata, #search, #selection { flex-shrink: 0; }
    label { display: grid; gap: 4px; min-width: 0; }
    input, select, button { min-width: 0; font: inherit; color: inherit; }
    input[type="search"], select {
      width: 100%; min-height: 32px; border: 1px solid var(--control); border-radius: 8px;
      background: linear-gradient(150deg, #263249, var(--field)); padding: 5px 8px;
    }
    input::placeholder { color: #aebbd4; opacity: 1; }
    .search-field { position: relative; }
    .search-field .icon { position: absolute; left: 9px; bottom: 8px; pointer-events: none; }
    input[type="search"] { padding-left: 33px; }
    .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 9px; }

    button {
      border: 1px solid var(--control); border-radius: 8px; padding: 5px 8px;
      background: linear-gradient(150deg, #2a3750, #202b40);
    }
    button:enabled { cursor: pointer; }
    button:enabled:hover { background: #344561; border-color: #a5b5dc; }
    button:disabled { opacity: .55; }
    :focus-visible { outline: 2px solid #a5caff; outline-offset: 2px; }
    #close { font-size: 19px; line-height: 1; width: 28px; height: 28px; padding: 0; flex-shrink: 0; }

    #catalog { flex: 1; min-height: 34px; overflow: auto; scrollbar-width: thin; }
    #results { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    #results:empty { border: 0; }
    #results li { border-bottom: 1px solid var(--line); }
    #results label { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 7px 2px; cursor: pointer; }
    #results label:hover { background: #a2bcff15; }
    #results input { margin: 0; width: 16px; height: 16px; accent-color: #6877ff; }
    .result-name { font-weight: 600; }
    small { font-size: inherit; font-weight: 400; }

    #selection { border-top: 1px solid var(--line); }
    .selection-title {
      display: flex; align-items: center; gap: 7px; padding: 6px 3px; font-size: 14px;
      background: linear-gradient(90deg, #2b406844, transparent);
      border-bottom: 1px solid #35446188;
    }
    #selected { max-height: 74px; overflow: auto; margin: 5px 0; padding-left: 23px; scrollbar-width: thin; }
    #selected li { margin: 3px 0; }
    #selected button { margin-left: 6px; padding: 1px 5px; color: #d1ddfa; }
    #preview { margin: 5px 0 7px; color: var(--muted); }
    .token-total { display: inline-block; padding: 2px 7px; border-radius: 6px; background: #2a3454; color: #d4c5ff; font-weight: 650; }
    #action-status { max-height: 56px; overflow: auto; color: var(--muted); }
    #action-status:empty, #status:empty, #preview:empty { display: none; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
    .actions button { display: flex; align-items: center; justify-content: center; flex: 1 0 auto; gap: 5px; min-height: 32px; }
    #insert { background: linear-gradient(#6578f4, #4438de); border-color: #8793ff; box-shadow: inset 0 1px #b0bbff55; }
    #insert:enabled:hover { background: linear-gradient(#7c8dff, #5145ea); }

    .glyphs { position: absolute; width: 0; height: 0; }
    .icon { width: 16px; height: 16px; flex: none; color: #d8e5ff; }
    .icon-box { display: grid; place-items: center; width: 22px; height: 22px; flex: none; border: 1px solid #64728d88; border-radius: 6px; background: #28344b; }
    .brand { width: 34px; height: 34px; background: linear-gradient(#343779, #242950); border-color: #6a6ed5; border-radius: 9px; }
    .brand .icon { width: 21px; height: 21px; color: #b6aaff; }

    @media (max-width: 290px) {
      body { padding: 10px; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-height: 435px) {
      body { gap: 6px; padding-block: 8px; }
      #selected { max-height: 48px; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <svg class="glyphs" aria-hidden="true"><symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol><symbol id="icon-project" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18m-11 0v2h4v-2"/></symbol><symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 13 4-4m-5 7-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></symbol><symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol><symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v5h4"/></symbol><symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="12" height="15" rx="2"/><path d="M16 21H4V7"/></symbol><symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol><symbol id="icon-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></symbol></svg>
  <header>
    <div class="heading"><span class="icon-box brand"><svg class="icon" aria-hidden="true"><use href="#icon-layers"/></svg></span><h1 data-label="picker"></h1></div>
    <button type="button" id="close" data-aria="close">×</button>
  </header>
  <div class="metadata">
    <div class="meta"><span class="icon-box badge"><svg class="icon" aria-hidden="true"><use href="#icon-project"/></svg></span><p id="project"></p></div>
    <div class="meta"><span class="icon-box badge"><svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></span><p id="destination"></p></div>
  </div>
  <form id="search">
    <label class="search-field"><span class="field-label" data-label="search"></span><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><input type="search" name="query" maxlength="250"></label>
    <div class="filters">
      <label><span class="field-label" data-label="tag"></span><select name="tag"></select></label>
      <label><span class="field-label" data-label="kind"></span><select name="kind"></select></label>
      <label><span class="field-label" data-label="status"></span><select name="status"></select></label>
    </div>
  </form>
  <section id="catalog">
  <p id="status" role="status" data-label="connecting"></p>
  <button type="button" id="retry" data-label="retry" hidden></button>
  <ul id="results"></ul>
  <button type="button" id="more" data-label="more" hidden></button>
  </section>
  <section id="selection" data-aria="selection">
    <div class="selection-title"><svg class="icon" aria-hidden="true"><use href="#icon-layers"/></svg><strong id="count"></strong></div>
    <ol id="selected"></ol>
    <p id="preview" role="status"></p>
    <p id="action-status" role="status"></p>
    <div class="actions">
      <button type="button" id="copy" disabled><svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg><span data-label="copy"></span></button>
      <button type="button" id="attach" disabled><svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg><span></span></button>
      <button type="button" id="insert" disabled hidden><svg class="icon" aria-hidden="true"><use href="#icon-add"/></svg><span data-label="insert"></span></button>
    </div>
  </section>
  <script src="context-picker.js"></script>
</body>
</html>
