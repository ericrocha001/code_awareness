name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-build:
    name: node-build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select npm
        run: npm install --global npm@10.9.4
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          $temporaryPath = Join-Path $env:RUNNER_TEMP 'code-awareness'
          New-Item -ItemType Directory -Path $temporaryPath -Force | Out-Null
          "TEMP=$temporaryPath" >> $env:GITHUB_ENV
          "TMP=$temporaryPath" >> $env:GITHUB_ENV
      - name: Install dependencies and prepare native runtime
        run: npm ci
      - name: Typecheck baseline gate
        run: npm run typecheck
      - name: Node tests
        run: npm run test:node
      - name: Build and native bundle guard
        run: npm run build

  electron-native:
    name: electron-native
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select npm
        run: npm install --global npm@10.9.4
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          $temporaryPath = Join-Path $env:RUNNER_TEMP 'code-awareness'
          New-Item -ItemType Directory -Path $temporaryPath -Force | Out-Null
          "TEMP=$temporaryPath" >> $env:GITHUB_ENV
          "TMP=$temporaryPath" >> $env:GITHUB_ENV
      - name: Install dependencies and prepare native runtime
        run: npm ci
      - name: Electron native tests
        run: npm run test:native

  git-heavy:
    name: git-heavy
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select npm
        run: npm install --global npm@10.9.4
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          $temporaryPath = Join-Path $env:RUNNER_TEMP 'code-awareness'
          New-Item -ItemType Directory -Path $temporaryPath -Force | Out-Null
          "TEMP=$temporaryPath" >> $env:GITHUB_ENV
          "TMP=$temporaryPath" >> $env:GITHUB_ENV
      - name: Install dependencies and prepare native runtime
        run: npm ci
      - name: Real Git tests — Heavy lane
        run: npm run test:git:heavy

  git-rest:
    name: git-rest
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select npm
        run: npm install --global npm@10.9.4
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          $temporaryPath = Join-Path $env:RUNNER_TEMP 'code-awareness'
          New-Item -ItemType Directory -Path $temporaryPath -Force | Out-Null
          "TEMP=$temporaryPath" >> $env:GITHUB_ENV
          "TMP=$temporaryPath" >> $env:GITHUB_ENV
      - name: Install dependencies and prepare native runtime
        run: npm ci
      - name: Real Git tests — Rest lane
        run: npm run test:git:rest

  ci-windows:
    name: ci-windows
    needs:
      - node-build
      - electron-native
      - git-heavy
      - git-rest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate parallel lane results (fail-closed gate)
        shell: bash
        run: |
          echo "Evaluating CI Windows parallel lane outcomes:"
          echo "- node-build: ${{ needs.node-build.result }}"
          echo "- electron-native: ${{ needs.electron-native.result }}"
          echo "- git-heavy: ${{ needs.git-heavy.result }}"
          echo "- git-rest: ${{ needs.git-rest.result }}"

          FAILED=0
          for lane in "node-build:${{ needs.node-build.result }}" \
                      "electron-native:${{ needs.electron-native.result }}" \
                      "git-heavy:${{ needs.git-heavy.result }}" \
                      "git-rest:${{ needs.git-rest.result }}"; do
            name="${lane%%:*}"
            result="${lane##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::Lane '$name' did not pass with success (status: '$result')"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::ci-windows gate FAILED: one or more required parallel lanes failed, were cancelled, or skipped."
            exit 1
          fi

          echo "ci-windows gate PASS: all parallel lanes succeeded."
